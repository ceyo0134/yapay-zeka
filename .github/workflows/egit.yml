name: Modeli egit
on:
  workflow_dispatch:
    inputs:
      model:
        description: Temel model
        type: choice
        default: Qwen/Qwen2.5-0.5B-Instruct
        options: [Qwen/Qwen2.5-0.5B-Instruct, Qwen/Qwen2.5-1.5B-Instruct]
      epochs:
        description: Kac tur egitilsin
        default: "3"
      rank:
        description: LoRA boyutu (parametre sayisi)
        default: "16"
permissions:
  contents: write
jobs:
  egit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: touch train.log
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers peft accelerate
      - name: Egit
        shell: bash
        run: |
          set -eo pipefail
          python egit.py 2>&1 | tee -a train.log
        env:
          MODEL: ${{ inputs.model }}
          EPOCHS: ${{ inputs.epochs }}
          RANK: ${{ inputs.rank }}
      - shell: bash
        run: pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu 2>&1 | tail -n 15 | tee -a train.log
      - name: numpy surumunu sabitle (MLC uyumu)
        run: pip install "numpy==1.26.4" 2>&1 | tail -n 5
      - name: Telefon formatina cevir
        shell: bash
        run: |
          set -eo pipefail
          python -m mlc_llm convert_weight ./merged --quantization q4f16_1 -o ./mlc --device cpu 2>&1 | tee -a train.log
          python -m mlc_llm gen_config ./merged --quantization q4f16_1 --conv-template qwen2 --context-window-size 4096 --prefill-chunk-size 1024 -o ./mlc 2>&1 | tee -a train.log
      - name: Yayinla (model dali)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          cd mlc
          echo "{\"base\":\"${MODEL#Qwen/}-q4f16_1-MLC\"}" > info.json
          du -sh .
          git init -q -b model
          git config user.name "egitim-botu"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -qm "egitilmis model"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" model
      - name: Kaydi yayinla (log dali)
        if: always()
        run: |
          mkdir /tmp/l && cp train.log /tmp/l/
          cd /tmp/l
          git init -q -b log
          git config user.name "egitim-botu"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -qm "log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" log
